name: Validate and build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned AAZ command models
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Azure/aaz
          ref: eea0104952d4d28e30c8df1679f7b02801e95046
          path: .aaz

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.22"
          python-version: "3.11"
          enable-cache: true

      - name: Install validation dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install \
            --python .venv/bin/python \
            --prerelease=allow \
            aaz-dev==4.7.1 \
            azure-cli-core==2.81.0 \
            build==1.3.0 \
            setuptools==79.0.1 \
            wheel==0.47.0

      - name: Validate Swagger
        run: |
          .venv/bin/python scripts/validate_swagger.py \
            --spec specification/app/resource-manager/Microsoft.App/SreAgent/stable/2026-01-01/sreagent.json

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s src/sre/azext_sre/tests -v

      - name: Verify generated source
        run: |
          .venv/bin/python scripts/generate_sre_extension.py \
            --aaz-dev .venv/bin/aaz-dev \
            --aaz-repo .aaz
          git add --intent-to-add src/sre/azext_sre/aaz
          git diff --exit-code -- src/sre/azext_sre/aaz docs/cli-reference.md

      - name: Build private wheel
        working-directory: src/sre
        run: uv build --wheel --no-build-logs

      - name: Verify wheel through a clean Azure CLI
        run: |
          uv venv --python 3.11 "${{ runner.temp }}/installed-cli"
          uv pip install \
            --python "${{ runner.temp }}/installed-cli/bin/python" \
            --prerelease=allow \
            azure-cli==2.81.0
          PATH="${{ runner.temp }}/installed-cli/bin:$PATH" \
            scripts/verify_installed_wheel.sh src/sre/dist/*.whl

      - name: Upload private wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sre-private-wheel
          path: src/sre/dist/*.whl
          if-no-files-found: error
          retention-days: 7
