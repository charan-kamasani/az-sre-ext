name: Build and test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-cli-core azure-cli-testsdk msrest azure-common build setuptools wheel

      - name: Run unit tests
        working-directory: src/sre
        run: python -m unittest discover -s azext_sre/tests -v

      - name: Check CLI reference is up to date
        run: python scripts/generate_cli_reference.py --check

      - name: Build wheel
        working-directory: src/sre
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sre-wheel
          path: src/sre/dist/*.whl
          if-no-files-found: error
          retention-days: 7

# NOTE: This is a deliberately minimal placeholder CI for early-stage development
# (unit tests + wheel build only). The full production pipeline -- swagger-drift
# validation, codegen regeneration checks, SBOM generation, signed releases -- is
# parked in .github/workflows-future/ until the command surface stabilizes and
# the missing supporting scripts (validate_swagger.py, generate_sre_extension.py,
# etc.) and docs/cli-reference.md are actually built.
