name: Build and test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-cli-core azure-cli-testsdk msrest azure-common build setuptools wheel

      - name: Run unit tests
        working-directory: src/sre
        run: python -m unittest discover -s azext_sre/tests -v

      - name: Check CLI reference is up to date
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/generate_cli_reference.py --check

      - name: Build wheel
        working-directory: src/sre
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sre-wheel
          path: src/sre/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  regeneration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned AAZ command models
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Azure/aaz
          ref: eea0104952d4d28e30c8df1679f7b02801e95046
          path: .aaz
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Regenerate and reject source drift
        run: |
          python -m pip install --upgrade pip
          python -m pip install aaz-dev==4.7.1 azure-cli-core==2.81.0
          python scripts/generate_sre_extension.py --aaz-dev "$(command -v aaz-dev)" --aaz-repo .aaz
          git add --intent-to-add src/sre/azext_sre/aaz
          git diff --exit-code -- src/sre/azext_sre/aaz docs/cli-reference.md

# NOTE: This CI runs unit tests, the CLI reference check, a wheel build and a
# byte-for-byte regeneration check of the generated aaz code. Swagger-drift
# validation, SBOM generation and signed releases are parked in
# .github/workflows-future/ until the missing supporting scripts
# (validate_swagger.py, validate_release_metadata.py, etc.) are actually built.
