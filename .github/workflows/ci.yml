name: Build and test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-cli==2.92.0 azure-cli-testsdk

      - name: Run unit tests
        working-directory: src/sre
        run: python -m unittest discover -s azext_sre/tests -v

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            azure-cli==2.92.0 \
            azure-cli-testsdk \
            build==1.3.0 \
            setuptools==79.0.1 \
            wheel==0.47.0

      - name: Check CLI reference is up to date
        run: |
          .venv/bin/python -m unittest discover -s scripts/tests -v
          .venv/bin/python scripts/generate_cli_reference.py --check

      - name: Build exactly one wheel
        working-directory: src/sre
        run: |
          ../../.venv/bin/python -m build --wheel --no-isolation
          set -- dist/*.whl
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one wheel, found $#." >&2
            exit 1
          fi

      - name: Verify wheel through a clean Azure CLI
        run: |
          PATH="$PWD/.venv/bin:$PATH" \
            scripts/verify_installed_wheel.sh src/sre/dist/*.whl

      - name: Verify wheel through the minimum supported Azure CLI
        run: |
          min_cli="$(python -c 'import json; print(json.load(open("src/sre/azext_sre/azext_metadata.json"))["azext.minCliCoreVersion"])')"
          python -m venv "$RUNNER_TEMP/az-min"
          "$RUNNER_TEMP/az-min/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/az-min/bin/python" -m pip install "azure-cli==$min_cli"
          PATH="$RUNNER_TEMP/az-min/bin:$PATH" \
            scripts/verify_installed_wheel.sh src/sre/dist/*.whl

      - name: Ensure repository tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short >&2
            exit 1
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sre-wheel
          path: src/sre/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  regeneration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned AAZ command models
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Azure/aaz
          ref: eea0104952d4d28e30c8df1679f7b02801e95046
          path: .aaz
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Regenerate and reject source drift
        run: |
          python -m pip install --upgrade pip
          python -m pip install aaz-dev==4.7.1 azure-cli-core==2.81.0
          python scripts/generate_sre_extension.py --aaz-dev "$(command -v aaz-dev)" --aaz-repo .aaz
          git add --intent-to-add src/sre/azext_sre/aaz
          git diff --exit-code -- src/sre/azext_sre/aaz docs/cli-reference.md

# This CI runs unit tests on a Python matrix, the CLI reference check, a wheel
# build verified in a clean Azure CLI and a byte-for-byte regeneration check of
# the generated aaz code. Releases are built by .github/workflows/release.yml.
# Swagger-drift validation stays parked in .github/workflows-future/.
