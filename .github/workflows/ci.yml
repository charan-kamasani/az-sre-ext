name: Build and test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-cli-core azure-cli-testsdk msrest azure-common build setuptools wheel

      - name: Run unit tests
        working-directory: src/sre
        run: python -m unittest discover -s azext_sre/tests -v

      - name: Check CLI reference is up to date
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/generate_cli_reference.py --check

      - name: Build wheel
        if: runner.os == 'Linux'
        working-directory: src/sre
        run: python -m build --wheel

      - name: Ensure repository tree is clean
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short >&2
            exit 1
          fi

      - name: Upload wheel artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sre-wheel
          path: src/sre/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  azdev-lint:
    # Same checks as the AI Gateway OneBranch pipeline (coreai/adc
    # .pipelines/templates/jobs/devx-python.yml): command-loader, azdev style,
    # azdev linter. Lint config is vendored in .github/lint-config.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: azdev style + linter
        run: |
          set -euo pipefail
          # azdev refuses to run outside a virtualenv (it reads VIRTUAL_ENV).
          python -m venv "$RUNNER_TEMP/azdev-venv"
          source "$RUNNER_TEMP/azdev-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install azdev wheel build flake8 pylint

          AZURE_CLI_DIR="$RUNNER_TEMP/azure-cli"
          AZDEV_REPO="$RUNNER_TEMP/azdev-ext-repo"
          git clone --depth=1 https://github.com/Azure/azure-cli.git "$AZURE_CLI_DIR"

          mkdir -p "$AZDEV_REPO/src"
          cp -r src/sre "$AZDEV_REPO/src/sre"
          rm -rf "$AZDEV_REPO/src/sre/dist" "$AZDEV_REPO/src/sre/build"
          cp .github/lint-config/pylintrc "$AZDEV_REPO/pylintrc"
          cp .github/lint-config/flake8-extensions.cfg "$AZDEV_REPO/.flake8"
          git -C "$AZDEV_REPO" init --initial-branch=main
          git -C "$AZDEV_REPO" -c user.email=ci@example.com -c user.name=ci commit --allow-empty -m bootstrap

          azdev setup --cli "$AZURE_CLI_DIR" --repo "$AZDEV_REPO"
          azdev extension add sre

          python scripts/check_command_loader.py
          azdev style sre

          azdev linter --include-whl-extensions sre --min-severity medium \
            --rule-types params commands command_groups help_entries \
            2>&1 | tee "$RUNNER_TEMP/azdev-linter.log"
          if grep -q "Unable to load extension 'sre" "$RUNNER_TEMP/azdev-linter.log"; then
            echo "::error::azdev linter could not load the sre extension; its command table was empty."
            exit 1
          fi

  wheel-smoke:
    # Installs the exact wheel built above into a clean Azure CLI. Linux covers
    # both the minimum supported CLI (azext_metadata.json minCliCoreVersion)
    # and the pinned version; Windows and macOS cover OS-specific install and
    # loading on the pinned version.
    name: wheel-smoke (${{ matrix.os }}, az ${{ matrix.azure-cli }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, azure-cli: "2.75.0" }
          - { os: ubuntu-latest, azure-cli: "2.81.0" }
          - { os: windows-latest, azure-cli: "2.81.0" }
          - { os: macos-latest, azure-cli: "2.81.0" }

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sre-wheel
          path: dist

      - name: Install Azure CLI ${{ matrix.azure-cli }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "azure-cli==${{ matrix.azure-cli }}"

      - name: Verify installed wheel
        shell: bash
        run: |
          version="$(python -c "import re; print(re.search(r\"VERSION = '([^']+)'\", open('src/sre/setup.py').read()).group(1))")"
          python scripts/verify_installed_wheel.py dist/sre-*.whl --expected-version "$version"

  regeneration-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned AAZ command models
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Azure/aaz
          ref: eea0104952d4d28e30c8df1679f7b02801e95046
          path: .aaz
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Regenerate and reject source drift
        run: |
          python -m pip install --upgrade pip
          python -m pip install aaz-dev==4.7.1 azure-cli-core==2.81.0
          python scripts/generate_sre_extension.py --aaz-dev "$(command -v aaz-dev)" --aaz-repo .aaz
          git add --intent-to-add src/sre/azext_sre/aaz
          git diff --exit-code -- src/sre/azext_sre/aaz docs/cli-reference.md

# NOTE: This CI runs unit tests on Windows/macOS/Linux, the CLI reference
# check, azdev style + linter, a clean-install smoke of the built wheel on
# every OS at the minimum and pinned Azure CLI versions, and a byte-for-byte
# regeneration check of the generated aaz code. Releases are built by
# .github/workflows/release.yml. Swagger-drift validation stays parked in
# .github/workflows-future/.
