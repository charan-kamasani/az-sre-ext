name: Live canary

# Runs the built wheel against real Azure: agent lifecycle, content round trip,
# RBAC grant/revoke, negative cases and a credential-leak scan. Weekly and on
# demand only, never on pull requests.
#
# Setup (see scripts/README.md):
# - A `live-canary` environment whose deployment branches are limited to
#   `master` (the OIDC subject below doesn't include the branch, so without
#   this any pushed branch could dispatch a modified workflow and get the token).
# - Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID on that
#   environment (AZURE_LOCATION optional, default eastus2).
# - A federated credential on the identity with subject
#   repo:charan-kamasani/az-sre-ext:environment:live-canary
# - Preferably a dedicated subscription, with Contributor plus Role Based Access
#   Control Administrator conditioned to the four SRE Agent roles (not User
#   Access Administrator). No Microsoft Graph permission is needed.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      skip-rbac:
        description: Skip the RBAC grant/revoke scenario
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-canary
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}

    steps:
      - name: Check configuration
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these variables on the live-canary environment:$missing"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Build wheel
        working-directory: src/sre
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0 setuptools==79.0.1 wheel==0.47.0
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Install Azure CLI and the wheel
        run: |
          python -m pip install "azure-cli==2.92.0"
          az extension add --source "$RUNNER_TEMP"/dist/sre-*.whl --yes
          az sre version -o json

      - name: Sign in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # The GitHub ID token azure/login uses as the client assertion expires
      # after about 5 minutes, so a token for a new audience can't be requested
      # later in the run (AADSTS700024). Acquire every audience the canary needs
      # now; the cached access tokens last about an hour.
      - name: Pre-acquire access tokens
        run: |
          az account get-access-token -o none
          az account get-access-token --resource https://azuresre.dev -o none

      - name: Run live canary
        # Leaves budget in the 60-minute job for cleanup and the sweep.
        timeout-minutes: 45
        env:
          SKIP_RBAC: ${{ inputs.skip-rbac && '--skip-rbac' || '' }}
        run: |
          python scripts/live_canary.py \
            --resource-group "rg-sre-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --agent-name "sre-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --results-dir "$RUNNER_TEMP/live-canary-results" \
            $SKIP_RBAC

      - name: Sign in to Azure again for cleanup
        if: always() && env.AZURE_CLIENT_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Delete canary resource group
        if: always() && env.AZURE_CLIENT_ID != ''
        run: |
          rg="rg-sre-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! exists=$(az group exists --name "$rg"); then
            echo "::warning::Could not check whether $rg still exists; delete it manually if it does."
          elif [ "$exists" = "true" ]; then
            az group delete --name "$rg" --yes --no-wait \
              || echo "::warning::Could not delete $rg; delete it manually."
          fi

      # Deletes canary groups left behind by earlier runs whose cleanup failed.
      - name: Sweep stale canary resource groups
        if: always() && env.AZURE_CLIENT_ID != ''
        run: |
          cutoff=$(date -u -d '6 hours ago' +%s)
          if ! groups=$(az group list --tag purpose=sre-live-canary \
              --query "[].[name, tags.\"sre-canary-created\"]" -o tsv); then
            echo "::warning::Could not list canary resource groups to sweep."
            exit 0
          fi
          while IFS=$'\t' read -r name created; do
            [ -n "$name" ] || continue
            if [ -z "$created" ] || [ "$created" = "None" ]; then
              echo "::warning::$name has no sre-canary-created tag; not sweeping it."
              continue
            fi
            if ! created_s=$(date -u -d "$created" +%s 2>/dev/null); then
              echo "::warning::$name has an unreadable sre-canary-created tag '$created'; not sweeping it."
              continue
            fi
            if [ "$created_s" -lt "$cutoff" ]; then
              echo "Deleting stale canary resource group $name (created $created)"
              az group delete --name "$name" --yes --no-wait \
                || echo "::warning::Could not delete stale canary resource group $name."
            fi
          done <<< "$groups"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-canary-results
          path: ${{ runner.temp }}/live-canary-results
          retention-days: 14
          if-no-files-found: ignore
