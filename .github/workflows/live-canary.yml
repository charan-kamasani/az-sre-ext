name: Live canary

# Runs the built wheel against real Azure: agent lifecycle, content round trip,
# RBAC grant/revoke, negative cases and a credential-leak scan. Weekly and on
# demand only, never on pull requests. Needs the `live-canary` environment with
# AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID variables for an
# OIDC (federated) identity holding Contributor and User Access Administrator
# on the subscription. AZURE_LOCATION is optional (default eastus2).

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      skip-rbac:
        description: Skip the RBAC grant/revoke scenario
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-canary
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}

    steps:
      - name: Check configuration
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these variables on the live-canary environment:$missing"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Build wheel
        working-directory: src/sre
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0 setuptools==79.0.1 wheel==0.47.0
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Install Azure CLI and the wheel
        run: |
          python -m pip install "azure-cli==2.81.0"
          az extension add --source "$RUNNER_TEMP"/dist/sre-*.whl --yes
          az sre version -o json

      - name: Sign in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run live canary
        env:
          SKIP_RBAC: ${{ inputs.skip-rbac && '--skip-rbac' || '' }}
        run: |
          python scripts/live_canary.py \
            --resource-group "rg-sre-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --agent-name "sre-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --results-dir "$RUNNER_TEMP/live-canary-results" \
            $SKIP_RBAC

      - name: Delete canary resource group
        if: always()
        run: |
          az group delete --name "rg-sre-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --yes --no-wait 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-canary-results
          path: ${{ runner.temp }}/live-canary-results
          retention-days: 14
          if-no-files-found: ignore
