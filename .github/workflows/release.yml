name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-cli azure-cli-testsdk build setuptools wheel

      - name: Check tag matches the package version
        run: |
          version="$(sed -n "s/^VERSION = '\(.*\)'/\1/p" src/sre/setup.py)"
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match setup.py version v${version}." >&2
            exit 1
          fi

      - name: Run unit tests
        working-directory: src/sre
        run: python -m unittest discover -s azext_sre/tests -v

      - name: Build wheel
        working-directory: src/sre
        run: python -m build --wheel

      - name: Create checksums
        working-directory: src/sre/dist
        run: |
          sha256sum *.whl > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Verify the install script against the built wheel
        run: |
          python -m http.server 8000 --directory src/sre/dist &
          sleep 2
          SRE_INSTALL_VERSION="$GITHUB_REF_NAME" \
          SRE_INSTALL_BASE_URL="http://localhost:8000" \
            sh scripts/install.sh
          az sre --help > /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *[ab][0-9]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            src/sre/dist/*.whl src/sre/dist/SHA256SUMS \
            --title "az sre $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
