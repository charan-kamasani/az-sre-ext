name: Publish private preview release

on:
  push:
    tags:
      - "v*.*.*b*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned AAZ command models
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Azure/aaz
          ref: eea0104952d4d28e30c8df1679f7b02801e95046
          path: .aaz
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.22"
          python-version: "3.11"
          enable-cache: true

      - name: Install pinned validation dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install \
            --python .venv/bin/python \
            --prerelease=allow \
            aaz-dev==4.7.1 \
            azure-cli-core==2.81.0 \
            build==1.3.0 \
            setuptools==79.0.1 \
            wheel==0.47.0

      - name: Validate tag and source version
        run: |
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "commit" ]; then
            echo "Release tags must be lightweight tags." >&2
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "Release tags must target the exact current main commit." >&2
            exit 1
          fi
          .venv/bin/python scripts/validate_release_metadata.py \
            --tag "$GITHUB_REF_NAME"

      - name: Validate Swagger
        run: |
          .venv/bin/python scripts/validate_swagger.py \
            --spec specification/app/resource-manager/Microsoft.App/SreAgent/stable/2026-01-01/sreagent.json

      - name: Run full unit suite
        run: .venv/bin/python -m unittest discover -s src/sre/azext_sre/tests -v

      - name: Regenerate and reject source drift
        run: |
          .venv/bin/python scripts/generate_sre_extension.py \
            --aaz-dev .venv/bin/aaz-dev \
            --aaz-repo .aaz
          git add --intent-to-add src/sre/azext_sre/aaz
          git diff --exit-code -- src/sre/azext_sre/aaz docs/cli-reference.md

      - name: Build exactly one wheel
        id: build
        working-directory: src/sre
        run: |
          ../../.venv/bin/python -m build --wheel --no-isolation
          set -- dist/*.whl
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one wheel, found $#." >&2
            exit 1
          fi
          version="$(
            ../../.venv/bin/python ../../scripts/validate_release_metadata.py \
              --tag "$GITHUB_REF_NAME" \
              --wheel "$1"
          )"
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          cp "$1" "$release_dir/"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "wheel=$release_dir/${1##*/}" >>"$GITHUB_OUTPUT"
          echo "release-dir=$release_dir" >>"$GITHUB_OUTPUT"

      - name: Verify wheel through a clean Azure CLI
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/installed-cli"
          uv pip install \
            --python "$RUNNER_TEMP/installed-cli/bin/python" \
            --prerelease=allow \
            azure-cli==2.81.0
          PATH="$RUNNER_TEMP/installed-cli/bin:$PATH" \
            scripts/verify_installed_wheel.sh \
              "${{ steps.build.outputs.wheel }}" \
              "${{ steps.build.outputs.version }}"

      - name: Generate pinned SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.build.outputs.wheel }}
          format: spdx-json
          output-file: ${{ steps.build.outputs.release-dir }}/sre-${{ steps.build.outputs.version }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Create and verify SHA-256 manifest
        run: |
          cd "${{ steps.build.outputs.release-dir }}"
          sha256sum \
            "sre-${{ steps.build.outputs.version }}-py3-none-any.whl" \
            "sre-${{ steps.build.outputs.version }}.spdx.json" \
            >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Ensure repository tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short >&2
            exit 1
          fi

      - name: Upload validated release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-preview-release-${{ github.sha }}
          path: ${{ steps.build.outputs.release-dir }}/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download validated release payload
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: private-preview-release-${{ github.sha }}
          path: release

      - name: Validate release payload
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="
          sre-${version}-py3-none-any.whl
          sre-${version}.spdx.json
          SHA256SUMS"
          actual="$(
            find release -maxdepth 1 -type f -exec basename {} \; |
              sort |
              sed '/^$/d'
          )"
          expected="$(printf '%s\n' "$expected" | sed '/^$/d' | sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'Unexpected release payload:\n%s\n' "$actual" >&2
            exit 1
          fi
          (cd release && sha256sum --check SHA256SUMS)

      - name: Attest release assets with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
          show-summary: true

      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          cat >"$notes" <<EOF
          Private preview release built from \`$GITHUB_SHA\`.

          Authenticate with GitHub CLI before downloading. Verify the wheel
          against \`SHA256SUMS\` and its GitHub artifact attestation.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Azure SRE Agent CLI $GITHUB_REF_NAME" \
            --notes-file "$notes"
          gh release upload "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY"
